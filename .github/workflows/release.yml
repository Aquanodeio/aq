name: Release

# On a version tag (v*), build the cross-platform `aq` binaries with GoReleaser
# and publish them as a GitHub Release on this repo. scripts/install.sh then
# fetches the matching tarball for a `curl … | sh` install.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Publishing to Aquanodeio/aq-releases (a DIFFERENT repo), so the
          # default GITHUB_TOKEN is not enough — it is scoped to this repo only.
          # RELEASES_PAT needs contents:write on Aquanodeio/aq-releases.
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
