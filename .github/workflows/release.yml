name: Release

# On a version tag (v*), build the cross-platform `aq` binaries with GoReleaser
# and publish them as a GitHub Release on this repo. scripts/install.sh then
# fetches the matching tarball for a `curl … | sh` install.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate release notes
        # goreleaser's own changelog template has no way to strip the `(#N)`
        # PR/issue refs from commit subjects (ticket #460 A4) — those refs
        # dangle-link on the public aq-releases repo since the numbered
        # issues/PRs live in this (private) repo. Generate the notes
        # ourselves and hand them to goreleaser via --release-notes, which
        # skips goreleaser's changelog generation outright (see
        # .goreleaser.yml's `changelog.disable`).
        run: ./scripts/release-notes.sh /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          # Publishing to Aquanodeio/aq-releases (a DIFFERENT repo), so the
          # default GITHUB_TOKEN is not enough — it is scoped to this repo only.
          # RELEASES_PAT needs contents:write on Aquanodeio/aq-releases.
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
