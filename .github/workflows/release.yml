name: Release

# On a version tag (v*), build the cross-platform `aq` binaries with GoReleaser
# and publish them as a GitHub Release on the SEPARATE public repo
# Aquanodeio/aq-releases. Both repos are public; they stay split because
# scripts/install.sh and the published install URL on the website point at
# aq-releases for the `curl … | sh` install, so moving the release would break
# every documented install line. GITHUB_TOKEN below is still required: the
# default token is scoped to THIS repo and cannot write to the other one.
on:
  push:
    tags:
      - "v*"

permissions:
  # This job never writes to Aquanodeio/aq via the default GITHUB_TOKEN — the
  # only publish step (GoReleaser, below) supplies its own cross-repo
  # credential via RELEASES_PAT, targeting the separate Aquanodeio/aq-releases
  # repo. `contents: read` is enough for actions/checkout. If a release run
  # ever fails, that's not a reason to "fix" this back to write — trace the
  # actual failure first.
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate release notes
        # Generate release notes to strip `(#N)` PR/issue refs — those refs
        # dangle-link on the public aq-releases repo since the numbered
        # issues/PRs live in this (private) repo. goreleaser's built-in
        # changelog template has no way to strip these refs, so we generate
        # notes ourselves and pass them via --release-notes. The changelog pipe
        # in .goreleaser.yml MUST stay enabled (disable: false) because it is
        # what loads this file; disabling the pipe means the flag is silently
        # ignored and the release body comes out EMPTY (shipped that way in
        # v0.2.1). See .goreleaser.yml and scripts/release-notes.sh.
        run: ./scripts/release-notes.sh /tmp/release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          # Publishing to Aquanodeio/aq-releases (a DIFFERENT repo), so the
          # default GITHUB_TOKEN is not enough — it is scoped to this repo only.
          # RELEASES_PAT needs contents:write on Aquanodeio/aq-releases.
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
